spring.application.name=Surplus_Management_System

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/surplus_management_system?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =========================================================
# SWAGGER
# =========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.example.surplus_management_system
springdoc.pathsToMatch=/api/**

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.com.example.surplus_management_system=INFO

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000